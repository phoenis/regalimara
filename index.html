<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Idee regalo per Mara</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,600;1,9..144,700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap">
<style>
:root {
  color-scheme: light;
  --bg-top: #FFFFFF; --bg-bottom: #FFFFFF;
  --ink: #16161A; --ink-2: #6C6C75;
  --accent: #16161A; --accent-soft: #F1F1F4; --accent-ink: #16161A; --on-accent: #FFFFFF; --free: #1E8A4C; --free-soft: #E3F4EA;
  --heart: #E5484D; --tile: #F3F3F6;
  --taken: #EDEDF1; --taken-ink: #4A4A53; --row-taken: #F7F7F9;
  --line: #ECECF0; --line-field: #8E8E99; --danger: #B42318; --card: #FFFFFF;
  --p-rosa: #F3F3F6; --p-menta: #EFF2F1; --p-pesca: #F4F2F0; --p-lilla: #F1F1F6; --p-burro: #F4F3EC;
  --display: "Fraunces", Georgia, "Times New Roman", serif;
  --body: "Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --fs-display: 2.25rem; --fs-h1: 1.875rem; --fs-h2: 1.375rem; --fs-row: 1.1875rem; --fs-body: 1.125rem; --fs-sm: 1rem; --fs-xs: 0.875rem;
  --px: 0.5rem; /* margine laterale della pagina */
  --s-1: 0.25rem; --s-2: 0.5rem; --s-3: 0.75rem; --s-4: 1rem; --s-5: 1.25rem; --s-6: 1.5rem; --s-8: 2rem; --s-12: 3rem;
  --r-sm: 12px; --r-md: 16px; --r-lg: 22px; --r-xl: 28px; --r-pill: 999px;
  --sh-card: 0 1px 2px rgba(0,0,0,.04), 0 6px 16px rgba(0,0,0,.06);
  --sh-hover: 0 2px 4px rgba(0,0,0,.06), 0 12px 24px rgba(0,0,0,.10);
  --sh-cta: 0 6px 16px rgba(0,0,0,.18);
}
@media (min-width: 780px) { :root { --fs-display: 3rem; --fs-h1: 2.5rem; --fs-h2: 1.5rem; --fs-row: 1.25rem; --r-lg: 24px; } }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; background: var(--bg-bottom); }
body {
  margin: 0; color: var(--ink); font-family: var(--body); font-size: var(--fs-body); line-height: 1.35;
  background: linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
  padding-left: max(var(--px), env(safe-area-inset-left, 0px)); padding-right: max(var(--px), env(safe-area-inset-right, 0px));
  padding-block: 0 var(--s-6); min-height: 100vh; overflow-x: hidden;
}
.wrap { max-width: 40rem; margin: 0 auto; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
button { font-family: inherit; }
header { padding: var(--s-4) 0 var(--s-1); text-align: center; display: flex; flex-direction: column; align-items: center; }
.hero { width: min(55%, 11rem); height: auto; display: block; margin-bottom: var(--s-2); }
.logo { width: 1.5rem; height: 1.5rem; color: var(--accent); fill: currentColor; margin-bottom: 0.625rem; }
h1 { font-family: var(--display); font-weight: 700; font-size: var(--fs-display); line-height: 1.1; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
.dtitle, .opts h2, .empty-card h2, .dlg h3 { letter-spacing: -0.01em; }
h1 span { color: var(--accent); font-style: italic; }
.lede { max-width: 38ch; margin: var(--s-2) 0 0; color: var(--ink-2); font-size: var(--fs-body); }
.demo-note { margin: var(--s-3) 0 0; padding: var(--s-2) var(--s-4); border-radius: var(--r-md); background: #fff; color: var(--ink-2); font-weight: 700; font-size: var(--fs-xs); line-height: 1.3; box-shadow: var(--sh-card); }
.chips { display: flex; gap: var(--s-2); margin: 0.6875rem calc(-1 * var(--px)) 0.9375rem; padding: var(--s-1) var(--px) var(--s-2); overflow-x: auto; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: 0 0 auto; font: 700 var(--fs-sm) var(--body); min-height: 2.75rem; border: 1px solid var(--line); background: var(--card); color: var(--ink);
  border-radius: var(--r-pill); padding: 0 var(--s-5); cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
@media (min-width: 780px) { .chips { flex-wrap: wrap; justify-content: center; margin-inline: 0; padding-inline: 0; overflow: visible; } }

/* ---------- elenco ---------- */
.grid { display: flex; flex-direction: column; gap: var(--s-3); margin-top: var(--s-3); }
.counts { margin: 0; color: var(--ink-2); font-weight: 700; font-size: var(--fs-sm); display: flex; align-items: center; justify-content: space-between; gap: var(--s-3); }
.card {
  background: var(--card); border-radius: var(--r-lg); box-shadow: var(--sh-card); padding: var(--s-3);
  display: grid; grid-template-columns: 4.75rem minmax(0, 1fr) auto; align-items: center; gap: 0.875rem; min-width: 0;
}
@media (min-width: 780px) { .card { grid-template-columns: 5.75rem minmax(0, 1fr) auto; gap: 1.25rem; padding: var(--s-3) var(--s-4) var(--s-3) var(--s-3); } }
.card .media { width: 4.75rem; height: 4.75rem; border-radius: var(--r-md); overflow: hidden; cursor: pointer; background: var(--p-rosa); position: relative; }
@media (min-width: 780px) { .card .media { width: 5.75rem; height: 5.75rem; } }
.card .media > img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card .ph { aspect-ratio: auto; height: 100%; }
.card .ph svg { width: 36%; }
.card .ph::after { inset: 0.375rem; border-radius: 10px; }
.body { display: flex; flex-direction: column; align-items: flex-start; gap: var(--s-1); min-width: 0; }
.card h2 { font-family: var(--body); font-weight: 800; font-size: var(--fs-row); line-height: 1.3; margin: 0; overflow-wrap: anywhere; letter-spacing: -0.01em; }
.card h2 .open { all: unset; cursor: pointer; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card h2 .open:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; border-radius: 4px; }
.meta { font-size: var(--fs-sm); font-weight: 700; color: var(--ink-2); display: flex; align-items: center; flex-wrap: wrap; gap: var(--s-1); }
.dots { display: inline-flex; align-items: center; gap: var(--s-2); }
.dots i { width: 0.8rem; height: 0.8rem; border-radius: 50%; margin-right: -0.4rem; border: 2px solid #fff; background: var(--p-rosa); }
.dots i:nth-child(2) { background: var(--p-menta); } .dots i:nth-child(3) { background: var(--p-lilla); margin-right: 0; }
.mine-meta { color: var(--accent-ink); }
.linkbtn { all: unset; cursor: pointer; color: var(--ink); text-decoration: underline; font-weight: 700; padding: var(--s-2) var(--s-1); }
.linkbtn:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; border-radius: 4px; }
.chip-taken { display: inline-flex; align-items: center; gap: var(--s-1); background: var(--taken); color: var(--taken-ink); font-size: var(--fs-xs); font-weight: 800; padding: var(--s-1) var(--s-3); border-radius: var(--r-pill); }
.chip-taken.plain { margin-top: var(--s-1); }
.round {
  width: 3rem; height: 3rem; border-radius: 50%; border: 0; background: var(--accent); color: #fff; display: grid; place-items: center; cursor: pointer;
}
.ico { fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.round .ico { width: 1.375rem; height: 1.375rem; }
button.round:hover { filter: brightness(1.06); }
.round.on { background: var(--accent-soft); box-shadow: 0 0 0 2px var(--accent); color: var(--accent); }

.round.off { background: var(--taken); color: var(--ink-2); }

.card.mine { box-shadow: 0 0 0 2px var(--accent), var(--sh-card); }
.card.done { background: var(--row-taken); box-shadow: none; }
.card.done .media { filter: grayscale(1); opacity: .6; }
.card.done h2 { color: var(--ink-2); }
@media (hover: hover) and (prefers-reduced-motion: no-preference) { .card { transition: box-shadow .15s, transform .15s; } .card:not(.done):not(.admin):hover { transform: translateY(-2px); box-shadow: var(--sh-hover); } }
.card.admin { grid-template-columns: 4rem minmax(0, 1fr); align-items: start; }
.card.admin .media { cursor: default; width: 4rem; height: 4rem; }
.card.admin h2 { font-size: 1.125rem; }
.admin-bar { padding-block: var(--s-2) !important; }
.admin-bar strong { font-size: 0.9375rem; }
.admin-bar .btn { font-size: 0.9375rem; min-height: 2.75rem; }
body.is-admin header { padding-bottom: 0; }
.admin-actions { grid-column: 1 / -1; display: flex; justify-content: space-between; border-top: 1px solid var(--line); margin: var(--s-1) calc(-1 * var(--s-3)) calc(-1 * var(--s-1)); padding-top: var(--s-1); }
.admin-actions button { flex: 0 0 auto; min-height: 2.75rem; border: 0; background: transparent; font: 800 var(--fs-sm) var(--body); color: var(--ink); cursor: pointer; padding: 0 var(--s-3); white-space: nowrap; }
.admin-actions .danger { color: var(--danger); }
.opt-text .btn { max-width: 100%; white-space: normal; text-align: center; line-height: 1.2; padding-block: 0.4rem; }
@media (max-width: 359px) { .admin-actions { flex-wrap: wrap; justify-content: center; } .admin-actions button { padding: 0 var(--s-2); font-size: 0.9375rem; } }
.admin-box { margin-top: var(--s-2); background: var(--card); border-radius: var(--r-lg); box-shadow: var(--sh-card); padding: var(--s-1) var(--s-3); }
.admin-box .admin-actions { margin: 0; border: 0; padding: 0; }
.empty-card { background: var(--card); border-radius: var(--r-xl); box-shadow: var(--sh-card); padding: var(--s-8) var(--s-5); text-align: center; }
.empty-card h2 { font-family: var(--display); font-weight: 700; font-size: 1.65rem; line-height: 1.1; margin: 0 0 var(--s-2); }
.empty-card p { margin: 0; color: var(--ink-2); }
.empty-art { position: relative; width: 8.75rem; height: 8.75rem; border-radius: 50%; background: var(--p-burro); color: var(--ink-2); display: grid; place-items: center; margin: 0 auto var(--s-4); }
.empty-art::after { content: ''; position: absolute; inset: 0.625rem; border: 2px dashed rgba(38,36,71,.28); border-radius: 50%; }
.empty-art svg { width: 32%; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; opacity: .7; }
body.is-empty .lede, body.is-empty #chips { display: none; }
.loading { text-align: center; color: var(--ink-2); margin: 0; }
.skeleton { pointer-events: none; }
.sk { border-radius: var(--r-md); background: linear-gradient(100deg, #F6EAE4 30%, #FCF4F0 50%, #F6EAE4 70%) 0 0 / 200% 100%; }
@media (prefers-reduced-motion: no-preference) { .sk { animation: shimmer 1.4s linear infinite; } }
@keyframes shimmer { to { background-position: -200% 0; } }
.sk-thumb { width: 4.75rem; height: 4.75rem; } .sk-lines { display: grid; gap: var(--s-2); } .sk-l1 { height: 1rem; width: 85%; border-radius: 6px; } .sk-l2 { height: 1rem; width: 40%; border-radius: 6px; } .sk-round { width: 3rem; height: 3rem; border-radius: 50%; }
footer { margin-top: var(--s-6); display: flex; flex-direction: column; align-items: center; gap: var(--s-2); color: var(--ink-2); font-size: var(--fs-sm); font-weight: 700; text-align: center; }
.btn.quiet { border: 0; background: transparent; text-decoration: underline; color: var(--ink-2); padding: var(--s-2) var(--s-3); min-height: 2.75rem; font-weight: 600; }

/* ---------- pulsanti ---------- */
.btn {
  font: 800 var(--fs-sm) var(--body); display: inline-flex; align-items: center; justify-content: center; gap: var(--s-2);
  border: 2px solid var(--ink); background: var(--card); color: var(--ink); border-radius: var(--r-pill); padding: 0 var(--s-5); min-height: 3rem; cursor: pointer; text-decoration: none;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); box-shadow: var(--sh-cta); }
.btn.outline { background: var(--card); }
.btn.danger { border-color: var(--danger); color: var(--danger); }
.btn.ghost { background: transparent; border: 1.5px solid #fff; color: #fff; }
.btn.small { min-height: 2.75rem; padding: 0 var(--s-4); white-space: nowrap; flex: 0 0 auto; }
.btn.wide { width: 100%; min-height: 3.25rem; font-size: var(--fs-body); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn .ico { width: 1.25rem; height: 1.25rem; }
.btn .arrow { width: 1.125rem; height: 1.125rem; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }
.admin-bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--ink); color: #fff;
  border-radius: 0; padding: var(--s-3) var(--px); margin: 0 calc(-1 * var(--px)); display: flex; align-items: center; gap: var(--s-2);
}
.admin-bar strong { margin-right: auto; font-weight: 800; white-space: nowrap; }
.admin-bar .btn { white-space: nowrap; padding: 0 var(--s-3); }
.admin-bar .dot { width: 0.6rem; height: 0.6rem; border-radius: 50%; background: #5BE0A5; }
.admin-bar :focus-visible { outline-color: #fff; }
body.is-admin header { align-items: flex-start; text-align: left; padding-top: var(--s-5); }
body.is-admin .logo, body.is-admin .lede, body.is-admin .hero, body.is-admin .demo-note, body.is-admin #chips { display: none; }
body.is-admin h1 { font-size: var(--fs-h1); }
.admin-note { margin: var(--s-2) 0 0; text-align: center; color: var(--ink-2); font-size: var(--fs-sm); }
.admin-actions { border-top-color: #F5EFED; }
.row-actions { display: none; }

/* ---------- foto ---------- */
.media { position: relative; background: var(--p-rosa); overflow: hidden; }
.media > img { width: 100%; height: auto; display: block; object-fit: cover; }
.ph { width: 100%; aspect-ratio: var(--ar, 4 / 3); display: grid; place-items: center; color: var(--ink-2); background: var(--p-rosa); }
.ph { position: relative; }
.ph::after { content: ''; position: absolute; inset: 0.5rem; border: 2px dashed rgba(38,36,71,.28); border-radius: 12px; pointer-events: none; }
.ph svg { width: 34%; max-width: 110px; height: auto; opacity: .6; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }
.ph img { width: 62%; height: 62%; object-fit: contain; }
.ph[data-t="0"] { background: var(--p-rosa); } .ph[data-t="1"] { background: var(--p-menta); } .ph[data-t="2"] { background: var(--p-pesca); }
.ph[data-t="3"] { background: var(--p-lilla); } .ph[data-t="4"] { background: var(--p-burro); }

/* ---------- dettaglio ---------- */
body.is-detail #head, body.is-detail #chips, body.is-detail #grid, body.is-detail #count { display: none; }
#detail { display: none; }
body.is-detail #detail { display: block; }
.back { display: inline-flex; align-items: center; min-height: 2.75rem; margin: var(--s-2) 0 var(--s-3); color: var(--ink); font-weight: 800; font-size: var(--fs-sm); text-decoration: none; }
.back:hover { text-decoration: underline; }
.dpage { display: flex; flex-direction: column; gap: var(--s-4); }
.gallery .media { border-radius: var(--r-lg); box-shadow: var(--sh-card); }
.gallery .media > img { aspect-ratio: 1; max-height: 70vh; object-fit: contain; background: var(--p-menta); }
.gallery .ph { aspect-ratio: 1; }
@media (min-width: 780px) { .gallery .media > img, .gallery .ph { aspect-ratio: 4 / 3; } }
.swipe { touch-action: pan-y; user-select: none; }
.swipe > img { pointer-events: none; -webkit-user-drag: none; }
.gnav { position: absolute; top: 50%; transform: translateY(-50%); width: 3rem; height: 3rem; border: 0; border-radius: 50%; background: #fff; color: var(--ink); line-height: 1; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.18); z-index: 2; display: grid; place-items: center; }
.gnav svg { width: 1.25rem; height: 1.25rem; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.gnav.prev { left: var(--s-3); } .gnav.next { right: var(--s-3); }
.gcount { position: absolute; right: var(--s-3); bottom: var(--s-3); background: rgba(38,36,71,.78); color: #fff; font-weight: 800; font-size: var(--fs-xs); padding: var(--s-1) var(--s-3); border-radius: var(--r-pill); }
.gdots { display: flex; justify-content: center; gap: var(--s-2); margin-top: var(--s-3); }
.gdots span { width: 0.5rem; height: 0.5rem; border-radius: 50%; background: #E8D3CB; }
.gdots span.on { width: 1.5rem; border-radius: var(--r-pill); background: var(--accent); }
.gthumbs { display: none; gap: var(--s-3); margin-top: var(--s-3); flex-wrap: wrap; }
.gthumbs button { width: 4.5rem; height: 4.5rem; padding: 0; border: 3px solid transparent; border-radius: var(--r-md); overflow: hidden; background: var(--card); cursor: pointer; }
.gthumbs button[aria-current="true"] { border-color: var(--accent); }
.gthumbs img { width: 100%; height: 100%; object-fit: cover; display: block; }
@media (min-width: 780px) { .gdots { display: none; } .gthumbs { display: flex; } }
.dinfo { display: flex; flex-direction: column; gap: var(--s-3); min-width: 0; }
.cat-chips { display: flex; flex-wrap: wrap; gap: var(--s-2); }
.chip-cat { align-self: flex-start; background: #fff; border: 1px solid var(--line); color: var(--ink-2); font-size: var(--fs-xs); font-weight: 800; padding: var(--s-1) var(--s-3); border-radius: var(--r-pill); }
.dtitle { font-size: var(--fs-h1); line-height: 1.1; text-align: left; text-wrap: wrap; }
.dprice { font-weight: 800; font-size: var(--fs-h2); }
.full { margin: 0; font-size: var(--fs-body); line-height: 1.4; white-space: pre-line; overflow-wrap: anywhere; }
.hint-d { margin: 0; color: var(--ink-2); font-size: var(--fs-sm); }
.btn.wide { width: 100%; }
.cta-panel { background: var(--card); border-radius: var(--r-xl); box-shadow: var(--sh-card); padding: var(--s-5); display: flex; flex-direction: column; gap: var(--s-3); margin-top: var(--s-2); }
.cta-panel .btn.primary { min-height: 3.5rem; }
.cta-panel .note { margin: 0; color: var(--ink-2); font-size: var(--fs-sm); text-align: center; }
.cta-panel .note.strong { color: var(--ink); font-weight: 800; }
@media (min-width: 780px) { .cta-panel.row { flex-direction: row-reverse; align-items: center; } .cta-panel.row .btn { width: auto; flex: 0 0 auto; padding: 0 var(--s-6); } .cta-panel.row .note { text-align: left; flex: 1; } }
.cta-panel.pair { flex-direction: row; flex-wrap: wrap; align-items: stretch; }
.cta-panel.pair .btn { flex: 1 1 0; min-width: 0; }
.cta-panel.pair .note { flex-basis: 100%; order: 3; text-align: left; }
.notice { display: flex; gap: var(--s-3); align-items: flex-start; background: var(--accent-soft); border-radius: var(--r-lg); padding: 0.875rem var(--s-4); }
.notice .ico { flex: 0 0 auto; width: 1.375rem; height: 1.375rem; color: var(--accent-ink); margin-top: 2px; }
.notice p { margin: 0; font-size: var(--fs-sm); }
.notice strong { color: var(--accent-ink); }
.opts { display: flex; flex-direction: column; gap: var(--s-3); }
.opts h2 { font-family: var(--display); font-weight: 700; font-size: var(--fs-h2); margin: 0; }
.opt { display: grid; grid-template-columns: 6rem minmax(0, 1fr); gap: var(--s-4); align-items: start; background: var(--card); border-radius: var(--r-lg); box-shadow: var(--sh-card); padding: var(--s-3); }
.opt-pic { width: 6rem; height: 6rem; border-radius: var(--r-md); overflow: hidden; background: var(--p-rosa); display: block; }
.opt-pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
.opt-pic .ph { aspect-ratio: auto; height: 100%; }
.opt-text { display: flex; flex-direction: column; align-items: flex-start; gap: var(--s-2); min-width: 0; }
.opt-info { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.opt-name { font-weight: 800; letter-spacing: -0.01em; font-size: var(--fs-row); line-height: 1.3; overflow-wrap: anywhere; }
.opt-price { font-weight: 700; color: var(--ink-2); font-size: var(--fs-sm); }
.opt-any { color: var(--ink-2); font-size: var(--fs-sm); }
@media (min-width: 780px) { .opt { align-items: center; grid-template-columns: 7rem minmax(0, 1fr); } .opt-pic { width: 7rem; height: 7rem; } .opt-text { flex-direction: row; align-items: center; justify-content: space-between; gap: var(--s-4); } }

/* ---------- finestre e modulo ---------- */
.overlay { position: fixed; inset: 0; z-index: 20; background: rgba(22,22,26,.5); display: grid; place-items: center; padding: var(--s-4); overflow-y: auto; }
.dlg { background: var(--card); color: var(--ink); border-radius: var(--r-xl); padding: var(--s-6); width: min(100%, 30rem); box-shadow: 0 12px 40px rgba(0,0,0,.25); }
.dlg h3 { font-family: var(--display); font-weight: 700; font-size: var(--fs-h2); line-height: 1.15; margin: 0 0 var(--s-3); }
