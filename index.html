<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Idee regalo per Mara</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,600&family=Nunito:wght@400;600;800&display=swap">
<style>
:root {
  color-scheme: light;
  --bg: #FFF6F1; --fg: #262447; --muted: #6B6785; --card: #FFFFFF; --line: #F3E4E0; --tint: #FBE3D8;
  --accent: #D63B68; --on-accent: #FFFFFF; --shadow: 0 0.25rem 1.125rem rgba(214,59,104,.09);
  --display: "Fraunces", Georgia, "Times New Roman", serif;
  --body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg) linear-gradient(180deg, #FFEBE3, #FFF6F1 22rem) no-repeat; color: var(--fg);
  font-family: var(--body); font-size: 1.125rem; line-height: 1.4;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
  padding-block: 0 32px; min-height: 100vh; overflow-x: hidden;
}
.wrap { max-width: 40rem; margin: 0 auto; }
header { padding: 28px 0 4px; text-align: center; display: flex; flex-direction: column; align-items: center; }
.logo { width: 2.5rem; height: 2.5rem; color: var(--accent); fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; margin-bottom: 6px; }
h1 { font-family: var(--display); font-weight: 700; font-size: clamp(2.125rem, 9vw, 3rem); line-height: 1.08; margin: 0; text-wrap: balance; letter-spacing: -.01em; }
h1 span { color: var(--accent); font-style: italic; }
.lede { max-width: 36ch; margin: 10px 0 0; color: var(--muted); font-size: 1.0625rem; line-height: 1.4; }
.hero { width: min(55%, 12rem); height: auto; display: block; margin-bottom: 8px; }
.demo-note { display: inline-block; margin: 12px 0 0; padding: 6px 14px; border-radius: 1rem; background: #fff; color: var(--muted); font-weight: 700; font-size: 0.875rem; line-height: 1.3; box-shadow: var(--shadow); }
.chips { display: flex; gap: 8px; margin: 18px -12px 6px; padding: 2px 12px 8px; overflow-x: auto; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: 0 0 auto; font: 700 1rem var(--body); border: 0; background: var(--card); color: var(--fg);
  border-radius: 999px; padding: 10px 18px; cursor: pointer; box-shadow: var(--shadow);
}
.chip[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.chip:focus-visible, button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.grid { display: flex; flex-direction: column; gap: 12px; margin-top: 8px; }
.card {
  background: var(--card); border-radius: 1.25rem; box-shadow: var(--shadow); padding: 10px;
  display: grid; grid-template-columns: 5rem minmax(0, 1fr) auto; align-items: center; gap: 14px; min-width: 0;
}
.card .media { width: 5rem; height: 5rem; border-radius: 1rem; overflow: hidden; cursor: pointer; background: var(--tint); position: relative; }
.card .media > img { width: 100%; height: 100%; min-height: 0; object-fit: cover; display: block; }
.card .ph { aspect-ratio: auto; height: 100%; }
.card .ph svg { width: 52%; }
.body { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.card h2 { font-family: var(--display); font-weight: 700; font-size: 1.1875rem; line-height: 1.15; margin: 0; overflow-wrap: anywhere; }
.card h2 .open { all: unset; cursor: pointer; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card h2 .open:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.price { font-weight: 800; font-size: 1.0625rem; color: var(--accent); }
.done .media, .done .body { opacity: .5; }
.round {
  width: 2.75rem; height: 2.75rem; border-radius: 50%; border: 0; background: var(--accent); color: #fff;
  display: grid; place-items: center; cursor: pointer; box-shadow: 0 0.25rem 0.625rem rgba(214,59,104,.3);
}
.round svg { width: 1.25rem; height: 1.25rem; fill: currentColor; }
.pill { font: 800 0.9375rem var(--body); border-radius: 999px; padding: 8px 14px; white-space: nowrap; }
.pill.taken { background: #EFEAF2; color: var(--muted); }
button.pill { border: 2px solid var(--accent); background: #fff; color: var(--accent); cursor: pointer; }
.card .row-actions { grid-column: 1 / -1; margin: 0; }
.empty { border: 2px dashed var(--line); border-radius: 1.25rem; padding: 36px 20px; text-align: center; color: var(--muted); background: #fff8; }
.loading { text-align: center; padding: 40px 0; color: var(--muted); font-weight: 700; }
footer { margin-top: 24px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; color: var(--muted); font-size: 1rem; }
.btn {
  font: 800 1rem var(--body); border: 1.5px solid var(--fg); background: var(--card); color: var(--fg);
  border-radius: 999px; padding: 10px 20px; cursor: pointer; min-height: 2.75rem;
}
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn.danger { border-color: #B3261E; color: #B3261E; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.quiet { border-color: transparent; background: transparent; text-decoration: underline; color: var(--muted); padding-inline: 4px; }
.btn.wide { width: 100%; text-align: center; text-decoration: none; display: block; }
.admin-bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--fg); color: #fff;
  border-radius: 1rem; padding: 10px 14px; margin-top: 14px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
}
.admin-bar strong { margin-right: auto; }
.admin-bar .btn { border-color: #fff; flex: 1 1 auto; }
.row-actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.row-actions .btn { padding: 6px 14px; font-size: 0.9375rem; min-height: 2.5rem; }
.media { position: relative; background: var(--tint); overflow: hidden; }
.media > img { width: 100%; height: auto; display: block; min-height: 120px; object-fit: cover; }
.ph { width: 100%; aspect-ratio: var(--ar, 4 / 3); display: grid; place-items: center; color: var(--accent); background: var(--tint); }
.ph svg { width: 34%; max-width: 110px; height: auto; opacity: .8; }
.ph img { width: 62%; height: 62%; object-fit: contain; }
.ph[data-t="0"] { background: #FBDDE5; color: #C83562; }
.ph[data-t="1"] { background: #D9F0E5; color: #2F8F6A; }
.ph[data-t="2"] { background: #FDE5D3; color: #D2692E; }
.ph[data-t="3"] { background: #E7DEF7; color: #7455B8; }
.ph[data-t="4"] { background: #FCF0C9; color: #B98A12; }
body.is-detail #head, body.is-detail #chips, body.is-detail #grid, body.is-detail #count { display: none; }
#detail { display: none; }
body.is-detail #detail { display: block; }
.back { display: inline-block; margin: 14px 0 8px; color: var(--accent); font-weight: 800; font-size: 1.0625rem; text-decoration: none; padding: 6px 0; }
.back:hover { text-decoration: underline; }
.dpage { display: flex; flex-direction: column; gap: 14px; }
.gallery .media { border-radius: 1.25rem; box-shadow: var(--shadow); }
.gallery .media > img { max-height: 70vh; object-fit: contain; background: var(--tint); }
.gthumbs { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
.gthumbs button { width: 4.5rem; height: 4.5rem; padding: 0; border: 2px solid transparent; border-radius: 0.875rem; overflow: hidden; background: var(--card); cursor: pointer; box-shadow: var(--shadow); }
.gthumbs button[aria-current="true"] { border-color: var(--accent); }
.gthumbs img { width: 100%; height: 100%; object-fit: cover; display: block; }
.info { display: flex; flex-direction: column; gap: 10px; min-width: 0; background: var(--card); border-radius: 1.25rem; box-shadow: var(--shadow); padding: 18px; }
.info .cat { font-weight: 800; font-size: 0.8125rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.info .dtitle { font-size: clamp(1.75rem, 7vw, 2.25rem); line-height: 1.1; text-align: left; }
.info .full { margin: 0; font-size: 1.125rem; line-height: 1.4; white-space: pre-line; overflow-wrap: anywhere; }
.info .taken { margin: 0; font-weight: 800; color: var(--muted); }
.info .hint-d { margin: 0; color: var(--muted); font-size: 1rem; line-height: 1.4; }
.info .price { font-size: 1.25rem; }
.overlay { position: fixed; inset: 0; z-index: 20; background: rgba(38,36,71,.5); display: grid; place-items: center; padding: 16px; overflow-y: auto; }
.dlg { background: var(--card); color: var(--fg); border-radius: 1.25rem; padding: 24px; width: min(100%, 30rem); box-shadow: 0 12px 40px rgba(0,0,0,.25); }
.dlg h3 { font-family: var(--display); font-weight: 700; font-size: 1.75rem; margin: 0 0 12px; }
.dlg label { display: block; font-weight: 800; font-size: 1rem; margin: 14px 0 4px; }
.dlg input[type=text], .dlg input[type=email], .dlg input[type=password], .dlg input[type=url], .dlg textarea, .dlg select {
  width: 100%; font: inherit; padding: 10px 12px; border-radius: 0.75rem; border: 1.5px solid var(--line); background: var(--bg); color: var(--fg);
}
.dlg .actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; margin-top: 20px; }
.dlg .inline { display: flex; gap: 8px; }
.dlg .hint { margin: 4px 0 0; font-size: 0.9375rem; color: var(--muted); font-weight: 600; }
.imgs { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0; }
.imgs .it { position: relative; width: 76px; height: 76px; border-radius: 10px; overflow: hidden; border: 1.5px solid var(--line); }
.imgs .it img { width: 100%; height: 100%; object-fit: cover; }
.imgs .it button { position: absolute; top: 2px; right: 2px; width: 28px; height: 28px; border: 0; border-radius: 50%; background: var(--fg); color: #fff; font-weight: 800; cursor: pointer; line-height: 1; }
.msg { margin: 10px 0 0; font-weight: 700; color: #B3261E; min-height: 1.4em; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: #fff; padding: 12px 20px; border-radius: 1rem; font-weight: 800; z-index: 30; width: max-content; max-width: min(90vw, 28rem); text-align: center; }
.styles { color: var(--muted); font-weight: 700; }
.swipe { touch-action: pan-y; user-select: none; }
.swipe > img { pointer-events: none; -webkit-user-drag: none; }
.gnav { position: absolute; top: 50%; transform: translateY(-50%); width: 2.5rem; height: 2.5rem; border: 0; border-radius: 50%; background: rgba(255,255,255,.92); color: var(--fg); font-size: 1.625rem; line-height: 1; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.2); z-index: 2; }
.gnav.prev { left: 8px; } .gnav.next { right: 8px; }
.gcount { position: absolute; right: 10px; bottom: 10px; background: rgba(38,36,71,.75); color: #fff; font-weight: 800; font-size: 0.8125rem; padding: 2px 10px; border-radius: 999px; }
.variants { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
.variants h2 { font-family: var(--display); font-weight: 700; font-size: 1.25rem; line-height: 1.15; margin: 4px 0 0; }
.vgrid { display: flex; flex-direction: column; gap: 12px; }
.vtile { display: grid; grid-template-columns: 5.5rem minmax(0, 1fr); gap: 12px; align-items: center; background: var(--bg); border-radius: 1rem; padding: 10px; min-width: 0; }
.vpic { display: block; }
.vimg { aspect-ratio: 1; border-radius: 0.75rem; overflow: hidden; background: var(--tint); display: grid; place-items: center; color: var(--accent); }
.vimg img { width: 100%; height: 100%; object-fit: cover; display: block; }
.vimg svg { width: 50%; height: auto; }
.vtext { display: flex; flex-direction: column; gap: 2px; min-width: 0; align-items: flex-start; }
.vname { font-size: 1.0625rem; font-weight: 800; line-height: 1.2; overflow-wrap: anywhere; }
.vprice { color: var(--accent); font-weight: 800; }
.btn.vlink { width: auto; text-align: center; text-decoration: none; margin-top: 4px; padding: 4px 14px; min-height: 2.25rem; font-size: 0.9375rem; display: inline-block; }
.vedit { display: flex; flex-direction: column; gap: 6px; border: 1.5px solid var(--line); border-radius: 0.875rem; padding: 10px; margin: 8px 0; }
.vedit input[type=text], .vedit input[type=url] { width: 100%; font: inherit; padding: 8px 10px; border-radius: 0.625rem; border: 1.5px solid var(--line); background: var(--bg); color: var(--fg); }
@media (prefers-reduced-motion: no-preference) { .card { transition: transform .15s; } }
@media (hover: hover) and (prefers-reduced-motion: no-preference) { .card:hover { transform: translateY(-2px); } }
@media (max-width: 560px) {
  .overlay { place-items: end center; padding: 0; }
  .dlg { width: 100%; max-height: 92vh; overflow-y: auto; border-radius: 1.25rem 1.25rem 0 0; }
  .dlg input, .dlg textarea { font-size: 1.0625rem; }
}
</style>
</head>
<body>
<div class="wrap">
  <header id="head">
    <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-7.5-4.8-9.6-9.6A5.4 5.4 0 0 1 12 6.4a5.4 5.4 0 0 1 9.6 4.5c-2.1 4.8-9.6 9.6-9.6 9.6z"/></svg>
    <h1>Idee regalo per <span>Mara</span></h1>
    <p class="lede">Tocca il cuore sull'idea che vuoi regalare: gli altri la vedranno come già presa.</p>
  </header>
  <div id="adminbar" hidden></div>
  <div class="chips" id="chips" role="group" aria-label="Filtra per categoria"></div>
  <main class="grid" id="grid"></main>
  <section id="detail" aria-live="polite"></section>
  <footer>
    <span id="count"></span>
    <button class="btn quiet" id="open-admin" type="button">Area riservata</button>
  </footer>
</div>
<div id="layer"></div>

<!-- Idee mostrate solo finché config.js non è compilato (modalità prova). Con Firebase le idee vivono nel database. -->
<script type="application/json" id="data">{"items":[]}</script>

<script src="config.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
