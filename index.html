<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Nunito:wght@400;600;800&display=swap">
<style>
/* Layout: festa di compleanno. Bandierine in cima, titolo grande, schede leggermente inclinate come biglietti appesi. */
:root {
  --bg: #FFF6FB; --fg: #2B1B3D; --muted: #6B5A7E; --card: #FFFFFF; --line: #EBDAF3;
  --c1: #FF4D6D; --c2: #FFB703; --c3: #14B8A6; --c4: #7C4DFF; --c5: #3A86FF;
  --on-band: #2B1B3D; --accent: #E0245E; --on-accent: #FFFFFF; --shadow: 0 6px 0 rgba(43,27,61,.10);
  --display: "Bagel Fat One", "Arial Rounded MT Bold", system-ui, sans-serif;
  --body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1E1330; --fg: #FFF1FA; --muted: #BBA6D6; --card: #2A1B42; --line: #43305F;
    --accent: #FF6B8E; --on-accent: #2B1B3D; --shadow: 0 6px 0 rgba(0,0,0,.35); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1E1330; --fg: #FFF1FA; --muted: #BBA6D6; --card: #2A1B42; --line: #43305F;
  --accent: #FF6B8E; --on-accent: #2B1B3D; --shadow: 0 6px 0 rgba(0,0,0,.35); color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 17px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px; min-height: 100vh; position: relative; overflow-x: hidden;
}
body::before {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: .5;
  background:
    radial-gradient(circle at 8% 22%, var(--c2) 0 5px, transparent 6px),
    radial-gradient(circle at 92% 14%, var(--c3) 0 6px, transparent 7px),
    radial-gradient(circle at 80% 62%, var(--c1) 0 4px, transparent 5px),
    radial-gradient(circle at 14% 76%, var(--c4) 0 5px, transparent 6px),
    radial-gradient(circle at 50% 90%, var(--c5) 0 4px, transparent 5px),
    radial-gradient(circle at 36% 40%, var(--c1) 0 3px, transparent 4px),
    radial-gradient(circle at 66% 30%, var(--c2) 0 3px, transparent 4px);
}
.wrap { position: relative; z-index: 1; max-width: 1040px; margin: 0 auto; }
.bunting { display: flex; height: 44px; overflow: hidden; margin-inline: -16px; }
.bunting i { flex: 0 0 56px; height: 40px; clip-path: polygon(0 0, 100% 0, 50% 100%); }
.bunting i:nth-child(5n+1) { background: var(--c1); } .bunting i:nth-child(5n+2) { background: var(--c2); }
.bunting i:nth-child(5n+3) { background: var(--c3); } .bunting i:nth-child(5n+4) { background: var(--c4); }
.bunting i:nth-child(5n+5) { background: var(--c5); }
header { padding: 28px 0 8px; }
.kicker { font-weight: 800; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); margin: 0 0 6px; }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(40px, 9vw, 84px); line-height: 1; margin: 0; text-wrap: balance; }
h1 span { color: var(--accent); }
.lede { max-width: 56ch; margin: 14px 0 0; color: var(--muted); font-size: 18px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 24px 0 8px; }
.chip {
  font: 800 14px var(--body); border: 2px solid var(--fg); background: transparent; color: var(--fg);
  border-radius: 999px; padding: 6px 14px; cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.chip:focus-visible, button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid var(--c5); outline-offset: 2px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 290px), 1fr)); gap: 26px 22px; margin-top: 22px; }
.card {
  background: var(--card); border: 2px solid var(--fg); border-radius: 18px; box-shadow: var(--shadow);
  display: flex; flex-direction: column; min-width: 0; overflow: hidden; position: relative;
}
.card:nth-child(odd) { transform: rotate(-.8deg); } .card:nth-child(even) { transform: rotate(.7deg); }
.band { background: var(--band); color: var(--on-band); padding: 8px 16px; font-weight: 800; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; display: flex; justify-content: space-between; gap: 8px; }
.body { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 0; }
.card h2 { font-family: var(--display); font-weight: 400; font-size: 25px; line-height: 1.1; margin: 0; text-wrap: balance; overflow-wrap: anywhere; }
.note { margin: 0; color: var(--muted); overflow-wrap: anywhere; }
.price { font-weight: 800; margin-top: auto; padding-top: 6px; }
.link { color: var(--accent); font-weight: 800; }
.done { opacity: .6; }
.stamp {
  position: absolute; top: 52px; right: 12px; transform: rotate(10deg); border: 3px solid var(--c1); color: var(--c1);
  font-family: var(--display); font-size: 20px; padding: 2px 10px; border-radius: 10px; background: var(--card);
}
.empty { border: 2px dashed var(--line); border-radius: 18px; padding: 36px 20px; text-align: center; color: var(--muted); grid-column: 1 / -1; }
footer { margin-top: 56px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; color: var(--muted); font-size: 15px; }
.btn {
  font: 800 15px var(--body); border: 2px solid var(--fg); background: var(--card); color: var(--fg);
  border-radius: 12px; padding: 8px 16px; cursor: pointer;
}
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn.danger { border-color: var(--c1); color: var(--c1); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.quiet { border-color: transparent; background: transparent; text-decoration: underline; color: var(--muted); padding-inline: 4px; }
.admin-bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--fg); color: var(--bg);
  border-radius: 14px; padding: 10px 14px; margin-top: 18px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
}
.admin-bar strong { margin-right: auto; }
.admin-bar .btn { border-color: var(--bg); }
.row-actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.row-actions .btn { padding: 4px 12px; font-size: 14px; }
.overlay { position: fixed; inset: 0; z-index: 20; background: rgba(20,10,30,.6); display: grid; place-items: center; padding: 16px; overflow-y: auto; }
.dlg { background: var(--card); color: var(--fg); border: 2px solid var(--fg); border-radius: 18px; padding: 22px; width: min(100%, 460px); box-shadow: var(--shadow); }
.dlg h3 { font-family: var(--display); font-weight: 400; font-size: 26px; margin: 0 0 12px; }
.dlg label { display: block; font-weight: 800; font-size: 14px; margin: 12px 0 4px; }
.dlg input[type=text], .dlg input[type=password], .dlg input[type=url], .dlg textarea, .dlg select {
  width: 100%; font: inherit; padding: 9px 12px; border-radius: 10px; border: 2px solid var(--line); background: var(--bg); color: var(--fg);
}
.dlg .check { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.dlg .actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; margin-top: 18px; }
.msg { margin: 10px 0 0; font-weight: 700; color: var(--c1); min-height: 1.4em; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-weight: 800; z-index: 30; max-width: 90vw; }
.media { position: relative; aspect-ratio: 4 / 3; background: var(--band); border-bottom: 2px solid var(--fg); overflow: hidden; }
.media img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ph { width: 100%; height: 100%; display: grid; place-items: center; font-family: var(--display); font-size: 84px; color: var(--on-band); opacity: .55; }
.thumbs { position: absolute; left: 8px; bottom: 8px; display: flex; gap: 6px; }
.thumbs button { width: 40px; height: 40px; padding: 0; border: 2px solid #fff; border-radius: 8px; overflow: hidden; background: var(--card); cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,.3); }
.thumbs button[aria-current="true"] { border-color: var(--accent); }
.thumbs img { width: 100%; height: 100%; object-fit: cover; }
.link { display: inline-block; margin-top: 4px; }
.imgs { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0; }
.imgs .it { position: relative; width: 72px; height: 72px; border-radius: 10px; overflow: hidden; border: 2px solid var(--line); }
.imgs .it img { width: 100%; height: 100%; object-fit: cover; }
.imgs .it button { position: absolute; top: 2px; right: 2px; width: 24px; height: 24px; border: 0; border-radius: 50%; background: var(--fg); color: var(--bg); font-weight: 800; cursor: pointer; line-height: 1; }
.dlg .inline { display: flex; gap: 8px; }
.dlg .hint { margin: 4px 0 0; font-size: 13px; color: var(--muted); font-weight: 600; }
@media (prefers-reduced-motion: no-preference) { .card { transition: transform .15s; } }
@media (hover: hover) and (prefers-reduced-motion: no-preference) { .card:hover { transform: rotate(0) translateY(-3px); } }
@media (max-width: 600px) {
  body { font-size: 16px; }
  .bunting { height: 32px; } .bunting i { flex-basis: 40px; height: 30px; }
  header { padding-top: 20px; }
  .lede { font-size: 16px; }
  .chips { flex-wrap: nowrap; overflow-x: auto; margin-inline: -16px; padding: 4px 16px 8px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: 0 0 auto; padding: 10px 16px; }
  .grid { gap: 20px; }
  .card:nth-child(n) { transform: none; }
  .btn { min-height: 44px; }
  .row-actions .btn { min-height: 40px; }
  .admin-bar strong { flex-basis: 100%; }
  .admin-bar .btn { flex: 1 1 auto; }
  .overlay { place-items: end center; padding: 0; }
  .dlg { width: 100%; max-height: 92vh; overflow-y: auto; border-radius: 18px 18px 0 0; border-bottom: 0; }
  .dlg input, .dlg textarea { font-size: 16px; }
  footer { margin-top: 36px; }
}
</style>

<script>
(function () {
  const pristine = document.body.innerHTML;
  const state = JSON.parse(document.getElementById('data').textContent);
  const $ = (id) => document.getElementById(id);
  const bands = ['var(--c1)', 'var(--c2)', 'var(--c3)', 'var(--c4)', 'var(--c5)'];
  let filter = 'Tutte', admin = false, dirty = false;
  try { admin = sessionStorage.getItem('regali-admin') === '1'; } catch (e) {}

  for (let i = 0; i < 40; i++) $('bunting').appendChild(document.createElement('i'));

  function el(tag, props, ...kids) {
    const n = document.createElement(tag);
    if (props) for (const k in props) { if (k === 'class') n.className = props[k]; else if (k.startsWith('on')) n.addEventListener(k.slice(2), props[k]); else n.setAttribute(k, props[k]); }
    for (const kid of kids) if (kid != null) n.append(kid);
    return n;
  }
  const cats = () => [...new Set(state.items.map((i) => i.cat).filter(Boolean))];
  const bandOf = (cat) => bands[Math.max(0, cats().indexOf(cat)) % bands.length];
  const safeUrl = (u) => /^https?:\/\//i.test(u || '') ? u : '';
  const safeImg = (u) => /^(https:\/\/|data:image\/(jpeg|png|webp|gif);base64,)/i.test(u || '') ? u : '';
  const hostOf = (u) => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return ''; } };
  const MAX_IMGS = 4;
  function fileToDataUrl(file) {
    return new Promise((resolve, reject) => {
      const fr = new FileReader();
      fr.onerror = reject;
      fr.onload = () => {
        const im = new Image();
        im.onerror = reject;
        im.onload = () => {
          const s = Math.min(1, 900 / Math.max(im.width, im.height));
          const c = document.createElement('canvas');
          c.width = Math.round(im.width * s); c.height = Math.round(im.height * s);
          c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
          resolve(c.toDataURL('image/jpeg', 0.75));
        };
        im.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  }

  function toast(text) {
    const t = el('div', { class: 'toast', role: 'status' }, text);
    document.body.appendChild(t); setTimeout(() => t.remove(), 3200);
  }

  function mediaOf(it) {
    const imgs = (it.imgs || []).map(safeImg).filter(Boolean);
    const media = el('div', { class: 'media' });
    const placeholder = () => el('div', { class: 'ph', 'aria-hidden': 'true' }, (it.title || '?').charAt(0).toUpperCase());
    if (!imgs.length) { media.appendChild(placeholder()); return media; }
    const main = el('img', { src: imgs[0], alt: it.title, loading: 'lazy', referrerpolicy: 'no-referrer' });
    main.addEventListener('error', () => main.replaceWith(placeholder()));
    media.appendChild(main);
    if (imgs.length > 1) {
      const thumbs = el('div', { class: 'thumbs' });
      imgs.forEach((src, n) => {
        const b = el('button', { type: 'button', 'aria-label': 'Foto ' + (n + 1), 'aria-current': String(n === 0) }, el('img', { src, alt: '', referrerpolicy: 'no-referrer' }));
        b.addEventListener('click', () => {
          main.src = src;
          thumbs.querySelectorAll('button').forEach((x) => x.setAttribute('aria-current', String(x === b)));
        });
        thumbs.appendChild(b);
      });
      media.appendChild(thumbs);
    }
    return media;
  }

  function render() {
    if (filter !== 'Tutte' && !cats().includes(filter)) filter = 'Tutte';
    const chips = $('chips'); chips.replaceChildren();
    ['Tutte', ...cats()].forEach((c) => chips.appendChild(el('button', { class: 'chip', type: 'button', 'aria-pressed': String(c === filter), onclick: () => { filter = c; render(); } }, c)));

    const list = state.items.filter((i) => filter === 'Tutte' || i.cat === filter);
    const grid = $('grid'); grid.replaceChildren();
    if (!list.length) grid.appendChild(el('div', { class: 'empty' }, admin ? 'Nessuna idea qui. Premi "Nuova idea" per aggiungerne una.' : 'Nessuna idea in questa categoria, per ora.'));
    list.forEach((it) => {
      const card = el('article', { class: 'card' + (it.done ? ' done' : ''), style: '--band:' + bandOf(it.cat) });
      card.appendChild(el('div', { class: 'band' }, el('span', null, it.cat || 'Varie')));
      if (it.done) card.appendChild(el('div', { class: 'stamp' }, 'Già preso'));
      card.appendChild(mediaOf(it));
      const body = el('div', { class: 'body' }, el('h2', null, it.title));
      if (it.note) body.appendChild(el('p', { class: 'note' }, it.note));
      if (it.price) body.appendChild(el('div', { class: 'price' }, it.price));
      const url = safeUrl(it.link);
      if (url) body.appendChild(el('a', { class: 'link', href: url, target: '_blank', rel: 'noopener noreferrer' }, 'Guarda su ' + (hostOf(url) || 'il sito') + ' ↗'));
      if (admin) body.appendChild(el('div', { class: 'row-actions' },
        el('button', { class: 'btn', type: 'button', onclick: () => editItem(it) }, 'Modifica'),
        el('button', { class: 'btn', type: 'button', onclick: () => { it.done = !it.done; markDirty(); render(); } }, it.done ? 'Rimetti in lista' : 'Segna come preso'),
        el('button', { class: 'btn danger', type: 'button', onclick: () => { state.items = state.items.filter((x) => x !== it); markDirty(); render(); } }, 'Elimina')));
      card.appendChild(body); grid.appendChild(card);
    });
    const open = state.items.filter((i) => !i.done).length;
    $('count').textContent = state.items.length + ' idee, ' + open + ' ancora da regalare';
    renderAdminBar();
  }

  function renderAdminBar() {
    const bar = $('adminbar'); bar.hidden = !admin; bar.className = admin ? 'admin-bar' : ''; bar.replaceChildren();
    $('open-admin').hidden = admin;
    if (!admin) return;
    bar.append(
      el('strong', null, dirty ? 'Gestione: ci sono modifiche da salvare' : 'Gestione attiva'),
      el('button', { class: 'btn', type: 'button', onclick: () => editItem(null) }, 'Nuova idea'),
      el('button', { class: 'btn', type: 'button', onclick: changePassword }, 'Cambia password'),
      el('button', { class: 'btn primary', id: 'save-btn', type: 'button', onclick: save }, 'Salva e pubblica'),
      el('button', { class: 'btn', type: 'button', onclick: () => { admin = false; try { sessionStorage.removeItem('regali-admin'); } catch (e) {} render(); } }, 'Esci'));
    $('save-btn').disabled = !dirty;
  }
  function markDirty() { dirty = true; }

  function modal(title, fields, onSubmit, submitLabel) {
    const layer = $('layer');
    const msg = el('p', { class: 'msg', role: 'alert' });
    const form = el('form', { class: 'dlg', novalidate: '' }, el('h3', null, title), ...fields, msg);
    const close = () => layer.replaceChildren();
    form.append(el('div', { class: 'actions' },
      el('button', { class: 'btn', type: 'button', onclick: close }, 'Annulla'),
      el('button', { class: 'btn primary', type: 'submit' }, submitLabel || 'Conferma')));
    form.addEventListener('submit', async (e) => { e.preventDefault(); const err = await onSubmit(form, close); if (err) msg.textContent = err; });
    layer.replaceChildren(el('div', { class: 'overlay' }, form));
    const first = form.querySelector('input,textarea,select'); if (first) first.focus();
  }
  const field = (id, label, extra) => [el('label', { for: id }, label), extra];

  function editItem(it) {
    const isNew = !it;
    const data = it || { id: 'i' + Date.now().toString(36), title: '', note: '', cat: filter !== 'Tutte' ? filter : '', price: '', link: '', done: false };
    const dl = el('datalist', { id: 'f-cats' }, ...cats().map((c) => el('option', { value: c })));
    const imgs = (data.imgs || []).slice();
    const imgBox = el('div', { class: 'imgs' });
    const imgMsg = el('p', { class: 'hint' });
    function drawImgs() {
      imgBox.replaceChildren(...imgs.map((src, n) => el('div', { class: 'it' },
        el('img', { src, alt: '', referrerpolicy: 'no-referrer' }),
        el('button', { type: 'button', 'aria-label': 'Rimuovi foto', onclick: () => { imgs.splice(n, 1); drawImgs(); } }, '×'))));
      imgMsg.textContent = imgs.length + ' di ' + MAX_IMGS + ' foto. La prima è quella grande sulla scheda.';
    }
    const fileIn = el('input', { id: 'f-file', type: 'file', accept: 'image/*', multiple: '' });
    fileIn.addEventListener('change', async () => {
      for (const f of [...fileIn.files]) {
        if (imgs.length >= MAX_IMGS) { toast('Massimo ' + MAX_IMGS + ' foto per idea'); break; }
        try { imgs.push(await fileToDataUrl(f)); } catch (e) { toast('Non riesco a leggere ' + f.name); }
      }
      fileIn.value = ''; drawImgs();
    });
    const urlIn = el('input', { id: 'f-imgurl', type: 'url', placeholder: 'https://… indirizzo di un\'immagine' });
    const addUrl = () => {
      const u = urlIn.value.trim();
      if (!u) return;
      if (!/^https:\/\//i.test(u)) { toast('L\'indirizzo deve iniziare con https://'); return; }
      if (imgs.length >= MAX_IMGS) { toast('Massimo ' + MAX_IMGS + ' foto per idea'); return; }
      imgs.push(u); urlIn.value = ''; drawImgs();
    };
    urlIn.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); addUrl(); } });
    drawImgs();
    modal(isNew ? 'Nuova idea' : 'Modifica idea', [
      ...field('f-title', 'Titolo', el('input', { id: 'f-title', type: 'text', value: data.title, maxlength: '80' })),
      ...field('f-note', 'Descrizione', el('textarea', { id: 'f-note', rows: '3', maxlength: '240' }, data.note)),
      ...field('f-cat', 'Categoria', el('input', { id: 'f-cat', type: 'text', value: data.cat, list: 'f-cats', maxlength: '24' })), dl,
      ...field('f-price', 'Prezzo indicativo', el('input', { id: 'f-price', type: 'text', value: data.price, maxlength: '24' })),
      ...field('f-link', 'Link dove comprarlo (facoltativo)', el('input', { id: 'f-link', type: 'url', value: data.link, placeholder: 'https://' })),
      ...field('f-file', 'Foto', fileIn), imgBox,
      el('div', { class: 'inline' }, urlIn, el('button', { class: 'btn', type: 'button', onclick: addUrl }, 'Aggiungi')),
      imgMsg,
      el('p', { class: 'hint' }, 'Su Amazon o altri negozi: tieni premuto sulla foto del prodotto, scegli "Copia indirizzo immagine" e incollalo qui. Oppure carica uno screenshot.'),
    ], (form, close) => {
      const v = (id) => form.querySelector('#' + id).value.trim();
      if (!v('f-title')) return 'Scrivi almeno il titolo.';
      if (v('f-link') && !safeUrl(v('f-link'))) return 'Il link deve iniziare con http:// o https://';
      Object.assign(data, { title: v('f-title'), note: v('f-note'), cat: v('f-cat'), price: v('f-price'), link: v('f-link'), imgs: imgs.slice() });
      if (isNew) state.items.unshift(data);
      markDirty(); close(); render();
    }, 'Salva idea');
  }

  async function hash(s) {
    try {
      const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('regali-mara:' + s));
      return [...new Uint8Array(b)].map((x) => x.toString(16).padStart(2, '0')).join('');
    } catch (e) { return 'p' + btoa(unescape(encodeURIComponent(s))); }
  }
  function enterAdmin() { admin = true; try { sessionStorage.setItem('regali-admin', '1'); } catch (e) {} render(); }

  function openLogin() {
    if (!state.pw) return createPassword('Crea la password', true);
    modal('Area riservata', [...field('f-pw', 'Password', el('input', { id: 'f-pw', type: 'password', autocomplete: 'current-password' }))], async (form, close) => {
      const h = await hash(form.querySelector('#f-pw').value);
      if (h !== state.pw) return 'Password sbagliata.';
      close(); enterAdmin();
    }, 'Entra');
  }
  function createPassword(title, entering) {
    modal(title, [
      ...field('f-pw1', 'Nuova password (almeno 6 caratteri)', el('input', { id: 'f-pw1', type: 'password', autocomplete: 'new-password' })),
      ...field('f-pw2', 'Ripetila', el('input', { id: 'f-pw2', type: 'password', autocomplete: 'new-password' })),
    ], async (form, close) => {
      const a = form.querySelector('#f-pw1').value, b = form.querySelector('#f-pw2').value;
      if (a.length < 6) return 'Servono almeno 6 caratteri.';
      if (a !== b) return 'Le due password non coincidono.';
      state.pw = await hash(a); markDirty(); close();
      if (entering) enterAdmin(); else render();
      toast('Password impostata. Premi "Salva e pubblica" per renderla attiva.');
    }, 'Imposta password');
  }
  function changePassword() { createPassword('Cambia password', false); }

  async function save() {
    const artifact = await claude.use('artifact').catch(() => null);
    if (!artifact) { toast('Salvataggio non disponibile qui. Apri la pagina dal tuo account.'); return; }
    const css = (document.head.querySelector('style') || {}).textContent || '';
    const json = JSON.stringify(state).replace(/</g, '\\u003c');
    const body = pristine.replace(/(<script type="application\/json" id="data">)[\s\S]*?(<\/script>)/, (m, a, b) => a + json + b);
    const html = '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + css + '</style></head><body>' + body + '</body></html>';
    try { await artifact.publish(html); dirty = false; toast('Pubblicato'); }
    catch (e) {
      const code = e && e.code;
      toast(code === 'conflict' ? 'La pagina è cambiata altrove. Ricarico l\'ultima versione.' : (code === 'not_granted' || code === 'not_writer') ? 'Solo il proprietario della pagina può salvare.' : 'Salvataggio non riuscito. Riprova.');
    }
  }

  $('open-admin').addEventListener('click', openLogin);
  window.addEventListener('beforeunload', (e) => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
  render();
})();
</script>
